# Builds the NRO and hands out the SD card layout. No game file is part of this.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "assets/banner.jpg"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/banner.jpg"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build python3 git zip ccache
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Repository check
        run: python3 tools/check_repo.py

      - name: Libraries
        # The image has what the build needs. The package server sometimes turns CI machines
        # away, and a build that goes on with the image's packages is better than none.
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed switch-dev switch-cmake deko3d uam switch-openal-soft switch-sdl2 switch-zlib && exit 0
            sleep 30
          done
          echo "::warning::the package server did not answer: building with the image's packages"

      # the whole game is about 1,100 files: without this every push builds them all
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 5G
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          ./build.sh -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats

      - name: Check the NRO
        run: python3 tools/check_nro.py build/quake4.nro "Quake 4" hazevauks

      - name: Fill the SD card layout
        run: |
          mkdir -p SD_CARD/switch/quake4/baseoq4
          cp build/quake4.nro SD_CARD/switch/quake4/
          python3 tools/fetch_pak0.py SD_CARD/switch/quake4/baseoq4/pak0.pk4

      - name: Check the package for game files
        run: |
          if find SD_CARD -type f | grep -viE '/README\.md$|\.nro$|/baseoq4/(pak0\.pk4|mod\.json)$'; then
            echo "SD_CARD holds something it should not"
            exit 1
          fi

      # What a player copies to the SD card's root, with their game files.
      - uses: actions/upload-artifact@v4
        with:
          name: Quake4NX_sd
          path: |
            SD_CARD/switch/
          if-no-files-found: error

      # What it takes to read a crash report of this build.
      - uses: actions/upload-artifact@v4
        with:
          name: Quake4NX_elf
          path: build/quake4.elf
          if-no-files-found: error

      - name: Package for a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd SD_CARD
          zip -r ../Quake4NX.zip switch

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Quake4NX.zip
          draft: true
